<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Viewer</title>
 
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="viewer">
  <div id="left-arrow" class="arrow">←</div>

  <img id="portfolio-image" src="" alt="Portfolio Image" />
  <video id="portfolio-video" playsinline muted loop controls></video>

  <div id="caption">
    <div id="lang-tabs">
      <button data-lang="fi" class="lang-btn active">FI</button>
      <button data-lang="sv" class="lang-btn">SV</button>
      <button data-lang="en" class="lang-btn">EN</button>
    </div>
    <p id="caption-text"></p>
  </div>

  <div id="right-arrow" class="arrow">→</div>
</div>

  <script src="script.js"></script>
</body>
</html>
